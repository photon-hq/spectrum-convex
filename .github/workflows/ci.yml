name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      # Build first: `typecheck` covers example/convex, which imports
      # `@spectrum-ts/convex` by package self-reference and so resolves through
      # `exports` into dist/.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
