name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what has changed since the
          # last release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Points npm at the public registry. Authentication is not a token —
          # see the publish step.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate CI runs. `convex codegen` is deliberately not run here:
      # it needs a live deployment, and `src/component/_generated` is committed.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      - uses: changesets/action@v1
        with:
          # Opens/updates the "Version Packages" PR when changesets are
          # pending; publishes when that PR has been merged.
          version: npm run version
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        # Publishing authenticates via npm trusted publishing (OIDC), not a
        # token: npm is configured to trust this repo's `release.yml`, and the
        # `id-token: write` permission above lets the runner mint the short-
        # lived credential it exchanges. Nothing to rotate, and npm attaches
        # provenance automatically. Requires npm >= 11.5.1 (Node 24 ships
        # 11.17.0).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
