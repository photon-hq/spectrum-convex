name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what has changed since the
          # last release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Points npm at the public registry. Authentication is not a token —
          # see the publish step.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate CI runs. `convex codegen` is deliberately not run here:
      # it needs a live deployment, and `src/component/_generated` is committed.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      # v2 is required, not just newer. v1 detected what had been published by
      # regex-scraping the publish script's stdout for "New tag: pkg@version";
      # @changesets/cli v3 prints "Successfully published:" instead, so v1 saw
      # zero published packages and silently skipped both the tag push and the
      # GitHub release — while npm had the version. v2 reads the release list
      # from changesets directly. It also renamed every input.
      - uses: changesets/action@v2
        with:
          # Opens/updates the "Version Packages" PR when changesets are
          # pending; publishes when that PR has been merged.
          version-script: npm run version
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # `create-github-releases` and `push-git-tags` both default to true.
        # No GITHUB_TOKEN env var: v2 dropped support for it and reads the
        # `github-token` input, which defaults to ${{ github.token }}.
        #
        # npm auth is trusted publishing (OIDC), not a token — npm trusts this
        # repo's `release.yml`, and `id-token: write` above lets the runner mint
        # the short-lived credential. Nothing to rotate, and provenance is
        # attached automatically. Needs npm >= 11.5.1 (Node 24 ships 11.17.0).
